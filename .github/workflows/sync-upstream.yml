name: Sync sf-skills upstream

on:
  schedule:
    # Tous les jours à 05:00 UTC (07:00 Paris en été, 06:00 en hiver)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Merger directement sur main au lieu d'ouvrir une PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync
        id: sync
        run: |
          python3 scripts/sync.py > /tmp/sync-summary.md
          echo "---- résumé ----"; cat /tmp/sync-summary.md
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream_date=$(python3 -c 'import json;print(json.load(open("SYNC_STATE.json"))["upstream_commit_date"])')" >> "$GITHUB_OUTPUT"

      - name: Validate plugins
        if: steps.sync.outputs.changed == 'true'
        run: python3 scripts/validate.py

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true' && inputs.auto_merge != true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/upstream
          delete-branch: true
          commit-message: "sync: forcedotcom/sf-skills @ ${{ steps.sync.outputs.upstream_date }}"
          title: "Sync sf-skills upstream (${{ steps.sync.outputs.upstream_date }})"
          body-path: /tmp/sync-summary.md
          labels: sync

      - name: Commit directly to main
        if: steps.sync.outputs.changed == 'true' && inputs.auto_merge == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: forcedotcom/sf-skills @ ${{ steps.sync.outputs.upstream_date }}"
          git push
